server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # No Access-Control-Allow-Origin here on purpose: the SPA is same-origin
    # with its API, and a wildcard CORS header on JS/CSS is needless attack
    # surface. Do not add it back.

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend health probe through the frontend (optional convenience path).
    location = /health {
        proxy_pass http://sec-backend:5000/health;
        access_log off;
    }

    location /api/ {
        proxy_pass http://sec-backend:5000/api/;
        proxy_set_header Host $host;
        # $remote_addr OVERWRITES any client-supplied value. Do not switch to
        # $proxy_add_x_forwarded_for here — that APPENDS, so the left-most hop
        # stays attacker-controlled. The backend reads X-Real-IP first and takes
        # the right-most XFF hop as defence in depth.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Content-Length $content_length;
    }
}
