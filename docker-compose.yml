version: "3.8"

networks:
  sec-net:
    driver: bridge

volumes:
  mysql-data:
    driver: local

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: sec-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-your_mysql_root_password}
      MYSQL_USER: ${MYSQL_USER:-your_mysql_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-your_mysql_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-security_dashboard}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - sec-net

  # FastAPI 后端
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sec-backend
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-min-32-chars}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-jwt-secret-key}
      - MYSQL_HOST=${MYSQL_HOST:-localhost}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-your_mysql_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-your_mysql_password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-security_dashboard}
      - ES_HOST=${ES_HOST:-your-es-host}
      - ES_PORT=${ES_PORT:-9200}
      - ES_SCHEME=${ES_SCHEME:-https}
      - ES_USER=${ES_USER:-elastic}
      - ES_PASSWORD=${ES_PASSWORD:-your_es_password}
      - ES_INDEX=${ES_INDEX:-online*nginx*}
      - ES_VERIFY_CERTS=${ES_VERIFY_CERTS:-false}
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mysql
    networks:
      - sec-net

  # Vue3 前端
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sec-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sec-net
